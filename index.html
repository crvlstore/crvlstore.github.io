<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CRVL Store — Oficial</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="logo">CRVL</h1>
      <nav class="main-nav">
        <a href="#home">Home</a>
        <a href="#shop">Loja</a>
        <a href="#about">Sobre</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="home" class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <h2>CRVL — Streetwear & Tênis</h2>
          <p>Estilo urbano com peças selecionadas. Explore a coleção.</p>
          <a href="#shop" class="cta">Ver produtos</a>
        </div>
        <div class="hero-image"><img src="assets/images/hero.svg" alt="CRVL — streetwear" loading="lazy" /></div>
      </div>
    </section>

    <section id="posts" class="posts-gallery">
      <div class="container">
        <h3 class="section-title">Postagens</h3>
        <div class="grid">
          <figure class="post">
            <img src="assets/images/gallery-1.jpg" alt="Post 1" loading="lazy" data-caption="Post 1" />
          </figure>
          <figure class="post">
            <img src="assets/images/gallery-2.jpg" alt="Post 2" loading="lazy" data-caption="Post 2" />
          </figure>
          <figure class="post">
            <img src="assets/images/gallery-3.jpg" alt="Post 3" loading="lazy" data-caption="Post 3" />
          </figure>
        </div>
      </div>
    </section>

    <section id="shop" class="shop">
      <h2>Produtos em destaque</h2>
      <div id="products" class="products-grid"></div>
    </section>

    <section id="about" class="about">
      <h2>Sobre a CRVL</h2>
      <p>Projeto clone — catálogo estático. Sistema de compras removido por decisão do mantenedor.</p>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">© CRVL Store — clone</div>
  </footer>

  <!-- Lightbox modal -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Fechar">×</button>
    <img class="lightbox-img" src="" alt="" />
    <div class="lightbox-caption"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
