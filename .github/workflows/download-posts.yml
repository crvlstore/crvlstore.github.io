name: Download Instagram posts and commit images to main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-posts:
    runs-on: ubuntu-latest
    env:
      POSTS: |
        https://www.instagram.com/p/DbTJkrajjlE/?igsi=MWxkZGpvYnp0YWMxOQ==
        https://www.instagram.com/p/DMiidJVM7sR/?igsi=MTFvMWIzaW40cXZqdA==
        https://www.instagram.com/p/DafgR7oOr1A/?igsi=YXFrOXJtNnAxZWRl
      OUT_DIR: "assets/images/posts-${{ github.run_id }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip imagemagick webp
          pip3 install --upgrade gallery-dl

      - name: Create directories
        run: |
          mkdir -p tmp
          mkdir -p "${{ env.OUT_DIR }}"
          ls -la

      - name: Download posts with gallery-dl
        run: |
          set -euo pipefail
          cd tmp
          for url in $POSTS; do
            echo "Downloading: $url"
            # gallery-dl will pick the best available image
            gallery-dl --no-mtime --output-template "%(id)s.%(extension)s" "$url" || true
          done
          ls -la || true

      - name: Optimize and create responsive variants
        run: |
          set -euo pipefail
          mkdir -p resized
          for img in tmp/*; do
            [ -e "$img" ] || continue
            filename=$(basename "$img")
            name="${filename%.*}"
            ext="${filename##*.}"
            # Convert to three widths: 1200, 768, 480 and also create WebP versions
            for w in 1200 768 480; do
              outfile="${{ github.workspace }}/$OUT_DIR/${name}-${w}.jpg"
              # Use ImageMagick to resize only if larger
              magick convert "$img" -resize ${w}x "$outfile" || cp "$img" "$outfile"
              # Create webp version
              magick convert "$outfile" -quality 85 "${{ github.workspace }}/$OUT_DIR/${name}-${w}.webp" || true
            done
            # Copy original as a fallback
            cp "$img" "${{ github.workspace }}/$OUT_DIR/${filename}"
          done
          ls -la "${{ github.workspace }}/$OUT_DIR" || true

      - name: Commit and push images to main
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add "$OUT_DIR"
          # If there are no changes, exit successfully
          if git diff --staged --quiet; then
            echo "No new images to commit"
            exit 0
          fi
          git commit -m "chore: add instagram posts images (optimized)"
          git push origin HEAD:main || (echo "Push failed — check repository Actions permissions (allow write to contents)" && exit 1)

      - name: Summary
        run: |
          echo "Images added to: $OUT_DIR"
          ls -la "$OUT_DIR" || true
