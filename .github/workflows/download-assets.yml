name: Download reference site assets

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  download:
    name: Download and push assets from reference site (create branch + PR)
    runs-on: ubuntu-latest

    env:
      REF_URL: "https://girafinha67.github.io/CRVL-store-/"
      BRANCH_NAME: "assets/download-${{ github.run_id }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Download reference site
        run: |
          set -euo pipefail
          TMP="tmp_ref_site"
          rm -rf "$TMP" || true
          mkdir -p "$TMP"
          cd "$TMP"
          # Mirror the site into tmp_ref_site
          wget --mirror --convert-links --adjust-extension --no-parent "${REF_URL}"

      - name: Collect images & fonts
        run: |
          set -euo pipefail
          REPO_ROOT="${{ github.workspace }}"
          TMP_DIR="$REPO_ROOT/tmp_ref_site/girafinha67.github.io/CRVL-store-"
          echo "Looking for downloaded files in: $TMP_DIR"
          mkdir -p "$REPO_ROOT/assets/images" "$REPO_ROOT/assets/fonts"
          if [ -d "$TMP_DIR" ]; then
            # copy image files
            find "$TMP_DIR" -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.svg" -o -iname "*.webp" \) -print0 | xargs -0 -I {} cp {} "$REPO_ROOT/assets/images/"
            # copy font files
            find "$TMP_DIR" -type f \( -iname "*.woff" -o -iname "*.woff2" -o -iname "*.ttf" -o -iname "*.otf" \) -print0 | xargs -0 -I {} cp {} "$REPO_ROOT/assets/fonts/" || true
          else
            echo "Downloaded directory not found. wget may have failed or site structure is different." >&2
            ls -la tmp_ref_site || true
            exit 1
          fi

      - name: Normalize filenames (remove query strings)
        run: |
          set -euo pipefail
          for f in assets/images/*; do
            [ -e "$f" ] || continue
            bn=$(basename "$f" | sed 's/?.*$//')
            if [ "$bn" != "$(basename "$f")" ]; then
              mv "$f" "assets/images/$bn"
            fi
          done
          for f in assets/fonts/*; do
            [ -e "$f" ] || continue
            bn=$(basename "$f" | sed 's/?.*$//')
            if [ "$bn" != "$(basename "$f")" ]; then
              mv "$f" "assets/fonts/$bn"
            fi
          done

      - name: Remove tmp files
        run: rm -rf tmp_ref_site || true

      - name: Create Pull Request with downloaded assets
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add reference site assets (downloaded)'
          commit-author: 'crvlstore-bot <noreply@github.com>'
          branch: ${{ env.BRANCH_NAME }}
          title: 'chore: add reference site assets (downloaded)'
          body: |
            This pull request adds assets mirrored from the reference site (images and fonts) into assets/images/ and assets/fonts/.

            Please review the files before merging.
          base: main
          paths: |
            assets/images/**
            assets/fonts/**
